[package]
name = "rp-ui"
version = "1.3.0"
edition = "2024"
description = "RustyPresenter's screens: the code Slint makes from ui/app.slint, in its own crate so it builds apart from the app"
publish = false
license = "MIT OR Apache-2.0"

[dependencies]
slint = { version = "1.18", features = ["unstable-winit-030", "raw-window-handle-06"] }

[build-dependencies]
slint-build = "1.18"

[features]
# Does nothing in the code. Several worktrees share one build folder (agent-check.ps1), and Cargo files this crate by
# its place in the workspace, so one worktree's screens could be built with another's build script; the app turns
# this on so the dock panels' screens (and the code build.rs writes for them) get a place of their own. The lead can
# drop it once every worktree has the dock panels.
dock-panels = []
