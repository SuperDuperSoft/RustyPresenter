[package]
name = "rustypresenter"
version = "0.2.0"
edition = "2024"
description = "Church presentation app: lyrics, scripture, slides, video, phone remote"
publish = false
# `cargo run` starts the Tauri app; the native app is `--bin rustypresenter-native`.
default-run = "rustypresenter"

[[bin]]
name = "rustypresenter-native"
path = "src/bin/native.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "fs", "process", "sync", "time", "io-util"] }
futures-util = { version = "0.3", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "6"
tauri = "2"
sha2 = "0.10"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
cosmic-text = "0.19.0"
tiny-skia = "0.12.0"
libloading = "0.8"
slint = { version = "1.18", features = ["unstable-winit-030"] }
glow = "0.18"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Settings → Video: the Copy button (Slint 1.18 has no public clipboard-write API).
arboard = { version = "=3.7.0", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
# Licensed Bible APIs. rustls with ring (aws-lc-rs needs cmake/nasm, which the MinGW toolchain lacks).
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# Imported Bible files (Zefania, OSIS, USX, OpenSong).
quick-xml = "0.38.4"

[build-dependencies]
tauri-build = "2"
slint-build = "1.18"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Graphics_Gdi", "Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
lto = "thin"
strip = true

[dev-dependencies]
i-slint-backend-testing = "1.18"
