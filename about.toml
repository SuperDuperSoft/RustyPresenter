# cargo-about configuration for THIRD-PARTY-LICENSES.txt (Plan 3 Task 21):
#   cargo about generate about.hbs -o THIRD-PARTY-LICENSES.txt
# CI regenerates the file and fails when the committed copy differs (.github/workflows/ci.yml, job `licenses`).
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "OFL-1.1",
    "BSL-1.0",
    "CC0-1.0",
    # ksni (Slint's Linux tray, through i-slint-core) is Unlicense only: a public-domain dedication.
    "Unlicense",
    "LicenseRef-Slint-Royalty-free-2.0",
]
# Windows, macOS and Linux builds ship the same crates the lock file resolves for these targets.
targets = [
    "x86_64-pc-windows-gnu",
    "x86_64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true

# Slint is used under its royalty-free licence (the operator shows AboutSlint in Settings → About). Its crates
# ship the licence texts under LICENSES/ rather than at the top, so cargo-about is pointed at that file. The file's
# own `license` is a different LicenseRef on purpose: cargo-about 0.9.2 skips a clarified file whose expression names
# the very LicenseRef it is looking for (generate.rs, the `LicenseItem::Other` arm), so naming it the same leaves the
# Slint section without text.

[slint.clarify]
license = "LicenseRef-Slint-Royalty-free-2.0"
[[slint.clarify.files]]
path = "LICENSES/LicenseRef-Slint-Royalty-free-2.0.md"
license = "LicenseRef-Slint-Royalty-free-2.0-text"
checksum = "5167f5056e850419106ab6265efbdca7cba4d99c849d1445ca0bbf6a1e2315fe"

