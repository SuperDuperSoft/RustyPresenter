# cargo-about configuration for THIRD-PARTY-LICENSES.txt (Plan 3 Task 21):
#   cargo about generate about.hbs -o THIRD-PARTY-LICENSES.txt
# CI regenerates the file and fails when the committed copy differs (.github/workflows/ci.yml, job `licenses`).
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "OFL-1.1",
    "BSL-1.0",
    "CC0-1.0",
    "LicenseRef-Slint-Royalty-free-2.0",
]
# Windows, macOS and Linux builds ship the same crates the lock file resolves for these targets.
targets = [
    "x86_64-pc-windows-gnu",
    "x86_64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
