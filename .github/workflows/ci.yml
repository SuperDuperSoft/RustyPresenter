name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # Exactly what the build scripts probe via pkg-config on Linux (cargo tree --target x86_64-unknown-linux-gnu):
          #   webkit2gtk-sys, javascriptcore-rs-sys, soup3-sys -> libwebkit2gtk-4.1-dev
          #   gtk/gdk/gdkx11/atk/pango/cairo/gdk-pixbuf/gio/glib-sys -> libgtk-3-dev
          #   libdbus-sys (tao "dbus" feature) -> libdbus-1-dev
          #   yeslogic-fontconfig-sys (Slint's text layout: parley -> fontique "system") -> libfontconfig-dev
          # Slint's winit/femtovg backend needs nothing else at build time: wayland-sys is built with
          # "dlopen", winit uses xkbcommon-dl, and glutin loads EGL/GLX at run time. libmpv is loaded at
          # run time too (gated video tests are skipped without RP_VIDEO_TESTS). No tray, rsvg or libxdo.
          sudo apt-get install -y pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libdbus-1-dev libfontconfig-dev
      # Release mode: Tauri test binaries on Windows crash in debug (STATUS_ENTRYPOINT_NOT_FOUND) until Tauri is removed.
      - run: cargo test --locked --release
      # Both binaries (Tauri `rustypresenter` and `rustypresenter-native`) and the examples link.
      - run: cargo build --locked --release --bins --examples

  # Feasibility check C4: Slint's testing backend drives a component headless.
  check-c4-ui-testing:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    env:
      SLINT_EMIT_DEBUG_INFO: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: experiments/c4-ui-testing
      # slint (default-features off: std + compat-1-2, no winit/linuxkms backends) plus
      # i-slint-backend-testing reach exactly one native library on Linux: fontique's "system"
      # feature pulls yeslogic-fontconfig-sys, whose build.rs runs pkg_config::find_library("fontconfig").
      # The linuxkms crates (xkbcommon, input/libinput, udev, libseat) sit in Cargo.lock only as
      # unselected optional dependencies and are never built.
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig-dev
      - run: cargo test --locked
        working-directory: experiments/c4-ui-testing

  # THIRD-PARTY-LICENSES.txt (shown in Settings → About) must match the lock file: regenerate it and fail on a
  # difference. To update it locally: cargo install cargo-about --version 0.9.2 --locked --features cli, then the command below.
  licenses:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-about
        run: cargo install cargo-about --version 0.9.2 --locked --features cli
      - run: cargo about generate about.hbs -o THIRD-PARTY-LICENSES.txt
      - run: git diff --exit-code THIRD-PARTY-LICENSES.txt
