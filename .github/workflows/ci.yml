name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libmpv-dev libfontconfig-dev
      # Release mode: Tauri test binaries on Windows crash in debug (STATUS_ENTRYPOINT_NOT_FOUND) until Tauri is removed.
      - run: cargo test --locked --release

  # Feasibility check C4: Slint's testing backend drives a component headless.
  check-c4-ui-testing:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    env:
      SLINT_EMIT_DEBUG_INFO: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: experiments/c4-ui-testing
      - run: cargo test
        working-directory: experiments/c4-ui-testing
