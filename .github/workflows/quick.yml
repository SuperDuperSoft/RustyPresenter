name: Quick check

# Fast feedback for the redesign branch: compile and unit tests on Linux. The full matrix runs at merge time.
on:
  push:
    branches: [redesign-media-library]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux packages
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libdbus-1-dev libfontconfig-dev
      # Cargo.lock is regenerated here after a dependency change: cloud sessions cannot reach crates.io.
      - run: cargo check --lib --bin rustypresenter
      # Artifacts cannot be downloaded from there either, so the change is printed in the log.
      - name: Cargo.lock changes
        run: echo "LOCKDIFF $(git diff Cargo.lock | gzip -9 | base64 -w0)"
      - run: cargo test --lib
