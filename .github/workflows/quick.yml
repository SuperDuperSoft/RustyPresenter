name: Quick check

# Fast feedback for the redesign branch: compile and unit tests on Linux. The full matrix runs at merge time.
on:
  push:
    branches: [redesign-media-library]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux packages
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libdbus-1-dev libfontconfig-dev
      - run: cargo check --locked --lib --bin rustypresenter-native
      - run: cargo test --locked --lib

  # The Bible box tests on the code before the redesign, to tell a regression from a Linux-only failure.
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5ac7307446991cb412266a3c1245577ba7cf0fa1
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux packages
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libdbus-1-dev libfontconfig-dev
      - run: cargo test --locked --lib ui::operator::bible

  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --release --lib
      - run: cargo build --locked --release --bin rustypresenter-native
