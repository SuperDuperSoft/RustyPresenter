name: Share an idea
description: Something RustyPresenter should do, or do better.
title: "Idea: "
labels: ["idea"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like it to do?
      description: Say it in your own words. What are you trying to get done on a Sunday?
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
      description: In RustyPresenter or in another program. Leave this empty if you do not.
