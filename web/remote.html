<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title data-t>RustyPresenter Remote</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0d0f13">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  :root { color-scheme: dark; --bg:#0d0f13; --panel:#171a21; --raise:#232833; --line:#2a303b; --text:#eceef3; --muted:#8d95a8; --accent:#f5b94a; --live:#ff4f55; --ok:#3ccf91; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.4 -apple-system, "Segoe UI", Roboto, system-ui, sans-serif; }
  body { padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); min-height: 100vh; }
  button { font: inherit; color: inherit; border: 0; cursor: pointer; }
  .pair { max-width: 380px; margin: 14vh auto 0; padding: 0 22px; text-align: center; }
  .pair h1 { font-size: 24px; margin: 0 0 8px; }
  .pair p { color: var(--muted); margin: 0 0 22px; }
  .pair input { width: 100%; font: 700 34px/1 ui-monospace, Consolas, monospace; letter-spacing: .3em; text-align: center; padding: 14px; border-radius: 14px; border: 2px solid var(--line); background: var(--panel); color: var(--text); outline: 0; }
  .pair input:focus { border-color: var(--accent); }
  .pair button { width: 100%; margin-top: 14px; padding: 16px; border-radius: 14px; background: var(--accent); color: #1a1405; font-weight: 800; font-size: 18px; }
  .err { color: #ff9a9e; margin-top: 12px; min-height: 22px; }
  .app { display: none; flex-direction: column; min-height: 100vh; padding: 12px; gap: 12px; }
  .bar { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #555; }
  .dot.on { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .now { background: var(--panel); border-radius: 16px; padding: 14px 16px; border: 1.5px solid rgba(255,79,85,.5); }
  .label { font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--live); margin-bottom: 6px; display: flex; justify-content: space-between; }
  .label span { color: var(--muted); letter-spacing: 0; text-transform: none; font-weight: 600; }
  .text { white-space: pre-wrap; font-size: 19px; font-weight: 600; min-height: 52px; }
  .now img { display: none; width: 100%; aspect-ratio: 16 / 9; object-fit: contain; background: #000; border-radius: 10px; }
  .now.pic img { display: block; }
  .now.pic .text { display: none; }
  .pnotes { display: none; background: var(--panel); border-radius: 16px; padding: 12px 16px; border: 1.5px solid rgba(120,170,255,.55); }
  .pnotes.on { display: block; }
  .pnotes .label { color: #8fb4ff; }
  .pnotes .text { font-size: 20px; font-weight: 500; color: #dce7ff; }
  .notesbtn { align-self: flex-end; background: var(--panel); color: var(--muted); border: 1px solid rgba(255,255,255,.15); border-radius: 10px; padding: 6px 12px; font-size: 13px; }
  .notesbtn.on { color: #8fb4ff; border-color: rgba(120,170,255,.55); }
  .next { background: var(--panel); border-radius: 16px; padding: 12px 16px; }
  .next .label { color: var(--muted); }
  .next .text { font-size: 15px; font-weight: 500; color: #f2d08f; min-height: 0; max-height: 64px; overflow: hidden; }
  .nav { display: grid; grid-template-columns: 1fr 1.7fr; gap: 10px; }
  .nav button { height: 92px; border-radius: 18px; background: var(--raise); font-size: 20px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .nav button:active { transform: scale(.98); }
  .nav .go { background: var(--accent); color: #1a1405; }
  .clears { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .clears button { padding: 14px 4px; border-radius: 12px; background: var(--panel); font-weight: 700; font-size: 14px; border: 1px solid var(--line); }
  .clears .all { grid-column: 1 / -1; background: #2a1517; color: #ffb0b3; border-color: rgba(255,79,85,.45); padding: 15px; font-size: 16px; }
  .clears .on { border-color: var(--accent); color: var(--accent); }
  .items { background: var(--panel); border-radius: 16px; overflow: hidden; }
  .items h2 { margin: 0; padding: 12px 16px 6px; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .it { display: flex; align-items: center; gap: 12px; padding: 13px 16px; border-top: 1px solid var(--line); }
  .it .n { color: var(--muted); width: 22px; text-align: right; font-size: 14px; }
  .it .t { flex: 1; font-weight: 600; }
  .it .k { color: var(--muted); font-size: 13px; }
  .it.live { background: rgba(255,79,85,.1); }
  .it.live .t { color: #ff9a9e; }
  .media { display: none; gap: 10px; }
  .media.on { display: grid; grid-template-columns: 1fr; }
  .media button { padding: 14px; border-radius: 12px; background: var(--raise); font-weight: 700; }
  .sheet { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: flex-end; z-index: 5; }
  .sheet.on { display: flex; }
  .sheet .box { background: var(--panel); width: 100%; border-radius: 20px 20px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); }
  .sheet h3 { margin: 0 0 4px; }
  .sheet p { color: var(--muted); margin: 0 0 14px; }
  .sheet .slides { display: flex; flex-direction: column; gap: 6px; max-height: 50vh; overflow-y: auto; margin-bottom: 12px; }
  .sheet .slides button { text-align: left; padding: 11px 12px; border-radius: 10px; background: var(--raise); white-space: pre-wrap; font-size: 14px; }
  .sheet .slides button small { display: block; color: var(--muted); font-size: 11px; font-weight: 700; margin-bottom: 2px; }
  .sheet .cancel { width: 100%; padding: 15px; border-radius: 12px; background: var(--raise); font-weight: 700; }
  .toast { position: fixed; left: 50%; top: 14px; transform: translateX(-50%); background: #3a1b1d; color: #ffd3d5; padding: 10px 14px; border-radius: 10px; display: none; z-index: 9; font-size: 14px; }
  .toast.good { background: #133524; color: #c6f5dd; }
  .secs { display: none; gap: 6px; overflow-x: auto; padding: 8px 0 0; }
  .sec { flex: none; min-width: 44px; height: 38px; border-radius: 10px; border: 1.5px solid var(--c); background: color-mix(in srgb, var(--c) 22%, transparent); color: inherit; font-weight: 700; font-size: 15px; }
  .sec.live { background: var(--c); color: #0d0f13; }
  .auto { display: none; flex-direction: column; gap: 8px; }
  .auto.on { display: flex; }
  .auto h2 { margin: 4px 0 0; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .row { display: flex; flex-wrap: wrap; gap: 8px; }
  .row button { padding: 13px 14px; border-radius: 12px; background: var(--raise); font-weight: 700; font-size: 15px; }
  .row .hide { background: var(--accent); color: #1a1405; }
  .macro { color: #111 !important; }
  .timer { display: flex; justify-content: space-between; background: var(--panel); border-radius: 12px; padding: 10px 14px; font-weight: 700; }
  .timer .over { color: var(--live); }
  .sheet input { width: 100%; font: inherit; padding: 12px; border-radius: 10px; border: 2px solid var(--line); background: var(--bg); color: var(--text); margin-bottom: 10px; }
  .stage { display: none; background: var(--panel); border-radius: 16px; padding: 12px 16px; border: 1.5px solid rgba(255,159,107,.6); }
  .stage.on { display: block; }
  .stage .label { color: #ff9f6b; }
  .stage .text { font-size: 15px; font-weight: 500; min-height: 0; max-height: 64px; overflow: hidden; }
  .stage button { margin-top: 8px; padding: 10px 14px; border-radius: 10px; background: var(--raise); font-weight: 700; }
  .sheet .only { display: flex; align-items: center; gap: 10px; margin: 0 0 12px; color: var(--muted); font-weight: 600; }
  .sheet .only input { width: 22px; height: 22px; margin: 0; accent-color: #ff9f6b; }
  .sheet .go { width: 100%; padding: 15px; border-radius: 12px; background: var(--accent); color: #1a1405; font-weight: 800; margin-bottom: 8px; }
  /* Drawing on the slide: a full-screen view with the tools, and the slide picture with a canvas over it. */
  .drawbtn { display: none; padding: 15px; border-radius: 14px; background: var(--raise); font-weight: 800; font-size: 17px; }
  .drawbtn.on { display: block; }
  .draw { position: fixed; inset: 0; z-index: 8; background: #000; display: none; flex-direction: column; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  .draw.on { display: flex; }
  .tools { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; padding: 8px; background: var(--panel); }
  .tools .grp { display: flex; gap: 6px; align-items: center; }
  .tools button { min-width: 44px; height: 44px; border-radius: 12px; background: var(--raise); font-weight: 700; font-size: 15px; padding: 0 12px; }
  .tools .sw { width: 36px; min-width: 36px; height: 36px; border-radius: 50%; padding: 0; border: 3px solid transparent; }
  .tools .sw.sel { border-color: #fff; box-shadow: 0 0 0 2px #000 inset; }
  .tools .size.sel, .tools .hl.sel, .tools .ink .sel { background: var(--accent); color: #1a1405; }
  .tools .ink { gap: 0; }
  .tools .ink button:first-child { border-radius: 12px 0 0 12px; }
  .tools .ink button:last-child { border-radius: 0 12px 12px 0; }
  @media (orientation: landscape) { .tools .ink button:first-child { border-radius: 12px 12px 0 0; } .tools .ink button:last-child { border-radius: 0 0 12px 12px; } }
  .tools .size i { display: block; margin: auto; border-radius: 50%; background: currentColor; }
  .tools .done { background: var(--accent); color: #1a1405; font-weight: 800; }
  .board { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .slide { position: relative; background: #111; }
  .slide img, .slide canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .slide canvas { touch-action: none; }
  @media (orientation: landscape) {
    .draw.on { flex-direction: row; }
    .tools { flex-direction: column; flex-wrap: nowrap; overflow-y: auto; }
    .tools .grp { flex-direction: column; }
  }
</style>
</head>
<body>
<div class="pair" id="pair">
  <h1 data-t>Phone remote</h1>
  <p id="pairHelp">On the presentation computer, click <b>Phone</b> → <b>Pair a phone</b>, then type the 6-digit code here.</p>
  <input id="pin" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••">
  <button id="pairBtn" data-t>Connect</button>
  <div class="err" id="pairErr"></div>
</div>
<div class="app" id="app">
  <div class="bar"><span class="dot" id="dot"></span><span id="svc" data-t>Connecting…</span></div>
  <div class="now"><div class="label" data-t>On screen <span id="nowLabel"></span></div><img id="nowImg" alt=""><div class="text" id="now"></div><div class="secs" id="secs"></div></div>
  <button class="notesbtn" id="notesBtn"></button>
  <div class="pnotes" id="pnotes"><div class="label" data-t>Presenter notes</div><div class="text" id="notesText"></div></div>
  <div class="stage" id="stage"><div class="label" data-t>Stage only</div><div class="text" id="stageText"></div><button id="stageOff" data-t>Take it off the stage</button></div>
  <div class="nav"><button id="prev">‹ Back</button><button class="go" id="next">Next ›</button></div>
  <div class="media" id="media"><button id="mediaBtn" data-t>Pause video</button></div>
  <button class="drawbtn" id="drawBtn" data-t>Draw on the slide</button>
  <div class="next"><div class="label" data-t>Up next <span id="nextLabel"></span></div><div class="text" id="nextText"></div></div>
  <div class="clears">
    <button class="all" data-c="clear_all" data-t>Clear All</button>
    <button data-c="clear_slide" data-t>Text</button><button data-c="clear_media" data-t>Media</button><button data-c="clear_audio" data-t>Audio</button><button data-c="logo" id="logoBtn" data-t>Logo</button>
  </div>
  <div class="auto" id="auto">
    <h2 id="msgHead" data-t>Message</h2><div class="row" id="msgs"></div>
    <h2 id="timerHead" data-t>Timers</h2><div id="timers"></div>
    <h2 id="macroHead" data-t>Macros</h2><div class="row" id="macros"></div>
  </div>
  <div class="items"><h2 data-t>Service</h2><div id="items"></div></div>
</div>
<div class="sheet" id="sheet"><div class="box"><h3 id="sheetTitle"></h3><p data-t>Tap a slide to put it on the screen.</p><label class="only"><input type="checkbox" id="sheetOnly"><span data-t>Stage screen only (the room won't see it)</span></label><div class="slides" id="sheetSlides"></div><button class="cancel" id="sheetCancel" data-t>Cancel</button></div></div>
<div class="sheet" id="ask"><div class="box"><h3 id="askTitle"></h3><div id="askFields"></div><button class="go" id="askGo"></button><button class="cancel" id="askCancel" data-t>Cancel</button></div></div>
<div class="draw" id="draw">
  <div class="tools">
    <div class="grp" id="swatches"></div>
    <div class="grp" id="sizes"></div>
    <button class="hl" id="hlBtn" data-t>Highlighter</button>
    <div class="grp ink"><button id="inkStays" data-t>Stays</button><button id="inkFades" data-t>Fades</button></div>
    <div class="grp">
      <button id="undoBtn" data-t>Undo</button>
      <button id="clearBtn" data-t>Clear all</button>
      <button class="done" id="doneBtn" data-t>Done</button>
    </div>
  </div>
  <div class="board" id="board"><div class="slide" id="slideBox"><img id="slideImg" alt=""><canvas id="pad"></canvas></div></div>
</div>
<div class="toast" id="toast"></div>
<script type="module" src="/static/remote.js"></script>
</body>
</html>
