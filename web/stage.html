<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RustyPresenter — Stage</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #07080a; color: #fff; font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; overflow: hidden; cursor: none; }
  .wrap { display: grid; grid-template-rows: auto 1fr auto auto; height: 100vh; padding: 2.2vh 3vw; box-sizing: border-box; gap: 1.6vh; }
  .top { display: flex; justify-content: space-between; align-items: baseline; color: #9aa3b5; font-size: 3vh; }
  .clock { color: #fff; font-size: 6vh; font-weight: 600; font-variant-numeric: tabular-nums; }
  .now { display: flex; align-items: center; justify-content: center; text-align: center; min-height: 0; overflow: hidden; }
  .now .t { font-size: 9vh; font-weight: 650; line-height: 1.15; white-space: pre-wrap; }
  .next { border-top: 2px solid #22262f; padding-top: 1.4vh; color: #f5c66b; font-size: 4.4vh; line-height: 1.2; white-space: pre-wrap; max-height: 22vh; overflow: hidden; }
  .next small { display: block; color: #8b93a7; font-size: 2.2vh; letter-spacing: .12em; text-transform: uppercase; margin-bottom: .6vh; }
  .notes { background: #12151b; border-radius: 1vh; padding: 1.2vh 1.6vw; font-size: 3.2vh; color: #cfe3ff; display: none; }
  .timer { color: #ff6b6b; font-weight: 700; font-variant-numeric: tabular-nums; }
  .dot { display: inline-block; width: 1.4vh; height: 1.4vh; border-radius: 50%; background: #3a3f4b; margin-right: .8vw; vertical-align: middle; }
  .dot.on { background: #3ccf91; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div><span class="dot" id="dot"></span><span id="title">Waiting for the service…</span></div><div><span class="timer" id="timer"></span>&nbsp;&nbsp;<span class="clock" id="clock"></span></div></div>
  <div class="now"><div class="t" id="now"></div></div>
  <div class="notes" id="notes"></div>
  <div class="next" id="next"><small>Next</small><span id="nextText"></span></div>
</div>
<script type="module">
const $ = id => document.getElementById(id);
const fmt = s => { s = Math.max(0, Math.round(s)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
setInterval(() => { $('clock').textContent = new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); }, 1000);
const text = s => !s ? '' : s.content.type === 'text' ? s.content.text : ({ image: '(slide picture)', video: '(video)', still: '(picture)', audio: '(audio)' })[s.content.type];
function fit(el, max) {
  let size = max; el.style.fontSize = size + 'vh';
  const box = el.parentElement;
  while (size > 3 && (el.scrollHeight > box.clientHeight || el.scrollWidth > box.clientWidth)) { size -= .4; el.style.fontSize = size + 'vh'; }
}
function render(m) {
  $('title').textContent = m.item ? m.item.title : 'Nothing live';
  const onAir = m.frame && (m.frame.slide || m.frame.media);
  $('now').textContent = m.slide && onAir ? text(m.slide) : (m.frame && m.frame.logo ? '(logo)' : '');
  $('now').style.opacity = onAir ? 1 : .35;
  fit($('now'), 9);
  $('nextText').textContent = m.next ? `${text(m.next.slide)}` : 'End of service';
  const notes = m.slide && m.slide.notes;
  $('notes').style.display = notes ? 'block' : 'none';
  $('notes').textContent = notes || '';
  const media = m.media || m.audio;
  $('timer').textContent = media && media.duration ? `−${fmt(media.duration - media.position)}` : '';
}
function connect() {
  const es = new EventSource('/events?role=stage');
  es.onopen = () => $('dot').classList.add('on');
  es.onmessage = e => { const m = JSON.parse(e.data); if (m.type === 'live') render(m); };
  es.onerror = () => $('dot').classList.remove('on');
}
connect();
</script>
</body>
</html>
