<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RustyPresenter — Room</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
  #host { position: fixed; inset: 0; }
  .layer { position: absolute; inset: 0; transition: opacity .35s ease; }
  .layer.entering { opacity: 0; }
  #unmute { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.8);
    color: #fff; font: 600 28px "Segoe UI", system-ui; cursor: pointer; z-index: 10; }
</style>
</head>
<body>
<div id="host"></div>
<div id="unmute">Click once to allow sound in this window</div>
<script type="module" src="/static/output.js"></script>
</body>
</html>
