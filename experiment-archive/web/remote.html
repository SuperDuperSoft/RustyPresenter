<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101416"><title>RustyPresenter Remote</title><link rel="stylesheet" href="/app.css"><script src="/app.js" defer></script></head><body data-mode="remote"><main class="remote-shell"><header class="remote-header"><div class="brand"><span class="brand-icon">R<span>P</span></span><div>RustyPresenter<small>PHONE REMOTE</small></div></div><span id="connection" class="connection">Connecting</span></header><form id="pair-form" class="pair-form"><div class="section-eyebrow">CONNECT TO THE SERVICE</div><h1>You're in control.</h1><p class="muted">Enter the pairing code from your operator screen.</p><label>8-digit pairing code<input id="pair-code" inputmode="numeric" pattern="[0-9]{8}" minlength="8" maxlength="8" autocomplete="off" placeholder="00000000" required></label><button class="primary full-width">Connect remote</button></form><section id="remote-controls" hidden><div class="monitor-label"><span class="live-label"><i></i> LIVE OUTPUT</span><span id="live-label" class="muted"></span></div><div id="live-preview" class="slide blank"></div><p id="live-status" class="muted small"></p><div class="remote-transport"><button id="previous">← Previous</button><button id="next" class="primary">Next →</button><button id="clear">Clear text</button><button id="blackout" class="danger-outline">Blackout</button></div><div class="remote-plan-heading"><h2 id="service-title">Service plan</h2><button id="disconnect">Disconnect</button></div><p class="muted small">Tap a slide below to send it directly to the congregation display.</p><div id="remote-plan"></div></section></main><div id="toast" role="status" hidden></div></body></html>
