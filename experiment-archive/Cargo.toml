[package]
name = "rustypresenter"
version = "0.1.0"
edition = "2024"
description = "A local-first church presentation host with live output and phone controls"
publish = false

[dependencies]
axum = "0.8"
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
strip = true
